[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."generate-plan-background"]
  background = true

[[redirects]]
  from = "/legal/privacidad"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/legal/privacidad/*"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
