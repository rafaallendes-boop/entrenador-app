[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."generate-plan-background"]
  background = true

# Endurecimiento pre-lanzamiento (Pre-Lanzamiento §5). Antes de este bloque el
# sitio se servía sin ningún header de seguridad. Alcance verificado contra el
# bundle de producción real (npm run build + grep de dist/assets), no
# adivinado:
#   - script-src sin 'unsafe-inline'/'unsafe-eval': cero eval()/new Function()
#     en dist/assets/*.js. CORRECCIÓN (code review): ese grep original se
#     perdió dist/assets/*.mjs, donde pdf.worker.min-*.mjs sí usa
#     `new Function` para su detector isEvalSupported. No se agregó
#     'unsafe-eval' — pdfImport.ts pasa `isEvalSupported: false` a
#     getDocument() para que el worker ni lo intente.
#   - style-src necesita 'unsafe-inline': React/Radix/Framer setean el
#     atributo style inline en runtime, que CSP gobierna vía style-src salvo
#     que se use style-src-attr por separado.
#   - connect-src NO incluye api.anthropic.com/api.openai.com/
#     generativelanguage.googleapis.com a propósito: ClaudeProvider/
#     OpenAIProvider/GeminiProvider (src/services/ai/providers/) SÍ quedan en
#     el bundle cliente y leen VITE_CLAUDE_API_KEY/VITE_OPENAI_API_KEY/
#     VITE_GEMINI_API_KEY, pero providerResolver.ts fuerza 'proxy' cuando
#     import.meta.env.PROD es true — ese camino nunca se ejecuta en prod salvo
#     que alguien rompa ese check. No agregar esos dominios es defensa en
#     profundidad: si ese camino se activara por error, el CSP lo corta antes
#     de que salga ningún dato. Ver nota operativa: nunca setear esas 4
#     VITE_*_API_KEY con una key real en el build de Netlify — Vite las
#     hornea en el JS público sin importar si el código las usa en runtime.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=15552000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com; connect-src 'self' https://*.supabase.co; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'"

[[redirects]]
  from = "/legal/privacidad"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/legal/privacidad/*"
  to = "/privacy"
  status = 301
  force = true

# Serve route-specific metadata to crawlers before the SPA catch-all.
[[redirects]]
  from = "/features"
  to = "/features/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/pricing"
  to = "/pricing/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/coaches"
  to = "/coaches/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/health-disclaimer"
  to = "/health-disclaimer/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/whoop-disclaimer"
  to = "/whoop-disclaimer/index.html"
  status = 200
  force = true

# The catch-all serves spa-fallback.html, not index.html: index.html is the
# public "/" homepage (index, follow) generated by
# scripts/generate-public-route-html.mjs, and every private/unknown route must
# keep the build's default noindex,nofollow instead of inheriting the
# homepage's crawl permission.
[[redirects]]
  from = "/*"
  to = "/spa-fallback.html"
  status = 200
