<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- route-metadata:start -->
  <!-- Rewritten per public route at build time by scripts/generate-public-route-html.mjs.
       Keep these markers: the generator fails the build if it cannot find them. -->
  <meta name="description" content="Planifica, registra y ajusta tu entrenamiento de squash, running, fuerza y movilidad con un coach AI que entiende tu semana." />
  <!-- Deny-by-default: dist/index.html es el mismo archivo físico para "/" y
       para el fallback SPA de TODA ruta privada/desconocida (ver
       scripts/generate-public-route-html.mjs), así que un valor estático no
       puede diferenciarlas. El generador lo reescribe a "index, follow" solo
       en las 8 copias de rutas públicas; RouteRobotsMeta (src/components/seo)
       lo corrige en runtime para navegación cliente a rutas privadas. -->
  <meta name="robots" content="noindex, nofollow" />
  <!-- route-metadata:end -->
  <meta name="theme-color" content="#0e0e0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RallyIQ" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/app-icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet" />
  <title>RallyIQ</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
