<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#201510"/>
      <stop offset="60%" stop-color="#100a06"/>
      <stop offset="100%" stop-color="#060402"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="220" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d00" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ff4d00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="256" cy="460" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt-fill" x1="308" y1="56" x2="200" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8040"/>
      <stop offset="100%" stop-color="#d63200"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="rgba(255,255,255,0.022)" stroke-width="0.5"/>
    </pattern>
    <filter id="bolt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Dark background -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Grid texture -->
    <rect width="512" height="512" fill="url(#grid)"/>

    <!-- Orange radial glow — top center -->
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- Orange radial glow — bottom echo -->
    <rect width="512" height="512" fill="url(#glow2)"/>

    <!-- Subtle inner corner accent — top left -->
    <circle cx="0" cy="0" r="180" fill="rgba(255,77,0,0.06)"/>

    <!-- Top accent line -->
    <rect x="0" y="0" width="512" height="2.5" fill="#ff4d00" opacity="0.6"/>

    <!-- Soft glow halo behind the bolt (blurred duplicate) -->
    <path d="M308,56 L144,280 H232 L200,456 L368,228 H280 L308,56Z"
      fill="#ff4d00" opacity="0.18" filter="url(#bolt-glow)"
      transform="scale(1.08) translate(-19,-14)"/>

    <!-- Bolt shadow (depth layer) -->
    <path d="M308,56 L144,280 H232 L200,456 L368,228 H280 L308,56Z"
      fill="rgba(0,0,0,0.55)" transform="translate(4,7)"/>

    <!-- Main bolt -->
    <path d="M308,56 L144,280 H232 L200,456 L368,228 H280 L308,56Z"
      fill="url(#bolt-fill)"/>

    <!-- Upper-right face highlight -->
    <path d="M308,56 L280,228 H368 L308,56Z"
      fill="rgba(255,165,85,0.48)"/>

    <!-- Left edge shine -->
    <path d="M308,56 L144,280 L160,280 L318,66Z"
      fill="rgba(255,255,255,0.09)"/>

    <!-- Bottom tip inner glow -->
    <path d="M200,456 L232,280 L220,280 L190,456Z"
      fill="rgba(255,100,30,0.25)"/>
  </g>

  <!-- Outer ring -->
  <rect width="512" height="512" rx="115" fill="none"
    stroke="rgba(255,77,0,0.20)" stroke-width="2"/>
</svg>
